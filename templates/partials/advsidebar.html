<div id="sidebarBackdrop" class="fixed inset-0 z-40 hidden bg-black/65 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>
<aside id="appSidebar" class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col border-r border-white/10 bg-[#0d0f10] shadow-2xl transition-transform duration-200 ease-out lg:w-64 lg:translate-x-0" aria-label="Main navigation">
  <div class="flex h-[72px] shrink-0 items-center justify-between border-b border-white/10 px-5">
    <a href="{{ url_for('dashboard.home') }}" class="flex items-center gap-3" aria-label="SkillForge home">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl border border-yellow-300/25 bg-yellow-300/10 text-lg text-yellow-200">✦</span>
      <span class="text-lg font-bold tracking-wide text-white">Skill<span class="text-yellow-200">Forge</span></span>
    </a>
    <button id="closeSidebar" type="button" class="rounded-lg p-2 text-gray-400 hover:bg-white/5 hover:text-white lg:hidden" aria-label="Close navigation">✕</button>
  </div>
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-5" aria-label="Primary">
    {% set current_endpoint = request.endpoint %}
    <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-[.18em] text-gray-600">Workspace</p>
    <a href="{{ url_for('dashboard.home') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition {% if current_endpoint == 'dashboard.home' %}border border-yellow-300/15 bg-yellow-300/10 text-yellow-100{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}"><span aria-hidden="true">⌂</span>Home</a>
    <a href="{{ url_for('skills.skills') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition {% if current_endpoint and current_endpoint.startswith('skills') %}border border-yellow-300/15 bg-yellow-300/10 text-yellow-100{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}"><span aria-hidden="true">◇</span>My skills</a>
    <a href="{{ url_for('communities.community') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition {% if current_endpoint and current_endpoint.startswith('communities') %}border border-yellow-300/15 bg-yellow-300/10 text-yellow-100{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}"><span aria-hidden="true">▤</span>Community resources</a>
    <p class="px-3 pb-2 pt-6 text-[10px] font-semibold uppercase tracking-[.18em] text-gray-600">Career</p>
    <a href="{{ url_for('internship.interns') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition {% if current_endpoint == 'internship.interns' %}border border-yellow-300/15 bg-yellow-300/10 text-yellow-100{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}"><span aria-hidden="true">⌕</span>Internships</a>
    <a href="{{ url_for('internship.applications') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition {% if current_endpoint == 'internship.applications' or current_endpoint == 'internship.update_application_status' %}border border-yellow-300/15 bg-yellow-300/10 text-yellow-100{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}"><span aria-hidden="true">☷</span>Applications</a>
  </nav>
  <div class="shrink-0 border-t border-white/10 p-3">
    <a href="{{ url_for('settings.setting') }}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm text-gray-400 hover:bg-white/5 hover:text-white"><span aria-hidden="true">⚙</span>Settings</a>
    <form action="{{ url_for('auth.logout') }}" method="POST"><button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-gray-400 hover:bg-white/5 hover:text-white" type="submit"><span aria-hidden="true">↪</span>Sign out</button></form>
  </div>
</aside>
