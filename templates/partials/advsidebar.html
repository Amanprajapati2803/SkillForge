<aside class="fixed left-0 top-0 h-screen w-64 bg-gradient-to-b from-[#0c0a08] to-[#11141b] border-r border-[var(--hairline)] z-50 flex flex-col">
  <!-- Logo -->
  <div class="h-[76px] flex items-center px-6 border-b border-[var(--hairline)]">
    <a href="{{ url_for('dashboard.home') }}" class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-gold/10 border border-gold/30 flex items-center justify-center">
        <svg class="w-4 h-4 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="font-serif text-xl font-bold text-[var(--gold-bright)] tracking-wide">SKILLFORGE</span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
    {% set current_endpoint = request.endpoint %}

    <a href="{{ url_for('dashboard.home') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint == 'dashboard.home' %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Home
    </a>

    <a href="{{ url_for('skills.skills') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint and current_endpoint.startswith('skills') %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      Skills
    </a>

    <a href="{{ url_for('dashboard.sessions') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint == 'dashboard.sessions' %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Sessions
    </a>

    <a href="{{ url_for('dashboard.certify') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint == 'dashboard.certify' %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Certificates
    </a>

    <a href="{{ url_for('internship.interns') }}" 
   class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint and current_endpoint.startswith('internship') %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
  </svg>
  Internships
</a>

    

    <a href="{{ url_for('dashboard.community') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint == 'dashboard.community' %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Community
    </a>

    <a href="{{ url_for('dashboard.leaderboard') }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all {% if current_endpoint == 'dashboard.leaderboard' %}bg-gold/10 text-gold border border-gold/20{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      Leaderboard
    </a>

    <!-- Cultivation Motto Box -->
    <div class="mt-6 mx-2 p-4 rounded-lg bg-gold/5 border border-gold/10">
      <p class="text-[10px] tracking-widest text-gold/70 mb-2">CULTIVATION MOTTO</p>
      <p class="text-sm text-gray-300 italic leading-relaxed">"Every step forward, forges your legacy."</p>
    </div>
  </nav>

  <!-- Bottom: Settings & Logout -->
  <div class="p-4 border-t border-[var(--hairline)] space-y-1">
    <a href="{{ url_for('setting_bp.settings') if setting_bp else '#' }}" 
       onclick="{% if not setting_bp %}event.preventDefault(); alert('Settings page coming soon!');{% endif %}"
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-all">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Settings
    </a>

    <a href="{{ url_for('auth.logout') if auth_bp else '#' }}" 
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Logout
    </a>
  </div>
</aside>
